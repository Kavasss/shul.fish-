<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polityka prywatności — Shul.Fish</title>
  <meta name="theme-color" content="#07131f">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="/" class="logo" aria-label="Shul.Fish">
        <img class="logo__mark" src="/img/logo.svg" alt="" width="34" height="34">
        <span class="logo__text">Shul<span class="logo__dot">.</span>Fish</span>
      </a>
      <a href="/" class="policy-back" id="policyBack"></a>
      <div class="lang" id="langSwitch" role="group" aria-label="Language"></div>
    </div>
  </header>
  <main class="container">
    <article class="policy" id="policy"></article>
  </main>
  <footer class="footer">
    <div class="container footer__inner">
      <span class="logo__text">Shul<span class="logo__dot">.</span>Fish</span>
    </div>
  </footer>
  <div class="toast" id="toast" hidden></div>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/privacy.js"></script>
</body>
</html>
