<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shul.Fish — ryby świeże, wędzone i solone z dostawą</title>
  <meta name="description" content="Shul.Fish: ryby świeże, wędzone i solone z dostawą do domu. Fresh, smoked and salted fish delivered.">
  <meta name="theme-color" content="#07131f">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="/" class="logo" aria-label="Shul.Fish">
        <img class="logo__mark" src="/img/logo.svg" alt="" width="34" height="34">
        <span class="logo__text">Shul<span class="logo__dot">.</span>Fish</span>
      </a>
      <nav class="nav">
        <a href="#catalog" data-i18n="nav_catalog">Katalog</a>
        <a href="#delivery" data-i18n="nav_delivery">Dostawa</a>
        <a href="#contact" data-i18n="nav_contact">Kontakt</a>
      </nav>
      <a class="header__phone" id="shopPhone" href="#"></a>
      <div class="lang" id="langSwitch" role="group" aria-label="Language"></div>
      <button class="account-btn" id="accountBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span class="account-btn__label" id="accountLabel" data-i18n="sign_in"></span>
      </button>
      <button class="cart-btn" id="cartBtn" type="button" data-i18n-aria="cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <span class="cart-btn__label" data-i18n="cart">Koszyk</span>
        <span class="cart-btn__count" id="cartCount" hidden>0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="container hero__inner">
      <div class="hero__text">
        <span class="eyebrow" data-i18n="hero_eyebrow"></span>
        <h1><span data-i18n="hero_title_1"></span> <span class="grad" data-i18n="hero_title_2"></span></h1>
        <p class="hero__lead" data-i18n="hero_lead"></p>
        <div class="hero__cta">
          <a class="btn btn--accent btn--lg" href="#catalog" data-i18n="hero_cta"></a>
          <span class="pill" id="deliveryInfo"></span>
        </div>
      </div>
      <div class="hero__art" aria-hidden="true">
        <img src="/img/hero.svg" alt="">
      </div>
    </div>
    <div class="container">
      <ul class="features">
        <li><b data-i18n="feat1_b"></b><span data-i18n="feat1_s"></span></li>
        <li><b data-i18n="feat2_b"></b><span data-i18n="feat2_s"></span></li>
        <li><b data-i18n="feat3_b"></b><span data-i18n="feat3_s"></span></li>
        <li><b data-i18n="feat4_b"></b><span data-i18n="feat4_s"></span></li>
      </ul>
    </div>
  </section>

  <main class="container" id="catalog">
    <div class="section-head">
      <h2 data-i18n="catalog"></h2>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-cat="all" type="button" data-i18n="cat_all"></button>
        <button class="tab" data-cat="fresh" type="button" data-i18n="cat_fresh"></button>
        <button class="tab" data-cat="smoked" type="button" data-i18n="cat_smoked"></button>
        <button class="tab" data-cat="salted" type="button" data-i18n="cat_salted"></button>
      </nav>
    </div>
    <div class="grid" id="products"><p class="muted" data-i18n="loading"></p></div>

    <section class="info" id="delivery">
      <h2 data-i18n="delivery_title"></h2>
      <div class="info__grid">
        <div class="info__card"><span class="info__icon">🚚</span><h3 data-i18n="courier"></h3><p id="infoCourier"></p></div>
        <div class="info__card"><span class="info__icon">📍</span><h3 data-i18n="pickup"></h3><p id="infoPickup"></p></div>
        <div class="info__card"><span class="info__icon">💳</span><h3 data-i18n="payment"></h3><p data-i18n="payment_text"></p></div>
      </div>
    </section>

    <section class="contact" id="contact">
      <div class="contact__intro">
        <h2 data-i18n="contact_title"></h2>
        <p class="muted" data-i18n="contact_lead"></p>
        <dl class="contact__list">
          <dt data-i18n="phone_opt"></dt><dd id="contactPhone"></dd>
          <dt>E-mail</dt><dd id="contactEmail"></dd>
          <dt data-i18n="pickup"></dt><dd id="contactAddress"></dd>
        </dl>
      </div>
      <form class="form contact__form" id="feedbackForm" novalidate>
        <div class="form__row">
          <label><span data-i18n="name"></span><input name="name" id="fbName" maxlength="100" autocomplete="name" required></label>
          <label><span>E-mail*</span><input name="email" id="fbEmail" type="email" maxlength="100" autocomplete="email" required></label>
        </div>
        <label><span data-i18n="phone_opt"></span><input name="phone" id="fbPhone" type="tel" maxlength="30" autocomplete="tel" data-i18n-placeholder="phone_ph"></label>
        <label><span data-i18n="message"></span><textarea name="message" id="fbMessage" rows="4" maxlength="3000" required></textarea></label>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="consent"><input type="checkbox" name="consent" id="fbConsent">
          <span><span data-i18n="consent_fb"></span> <a href="/privacy" target="_blank" data-i18n="privacy_ins"></a>.</span></label>
        <p class="error" id="fbError" hidden></p>
        <button class="btn btn--primary btn--lg" type="submit" id="fbSubmit" data-i18n="send"></button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="logo__text">Shul<span class="logo__dot">.</span>Fish</span>
      <nav class="footer__links">
        <a href="#contact" data-i18n="contacts"></a>
        <a href="/privacy" data-i18n="privacy"></a>
      </nav>
      <span class="muted">© <span id="year"></span> <span id="footerName"></span></span>
    </div>
  </footer>

  <!-- Корзина -->
  <aside class="drawer" id="cart" aria-hidden="true">
    <div class="drawer__panel">
      <div class="drawer__head">
        <h2 data-i18n="cart_title"></h2>
        <button class="icon-btn" data-close type="button" data-i18n-aria="close">✕</button>
      </div>
      <div class="drawer__body" id="cartItems"></div>
      <div class="drawer__foot">
        <div class="row row--total"><span data-i18n="items"></span><b id="cartTotal"></b></div>
        <p class="muted small" id="cartHint"></p>
        <button class="btn btn--accent btn--block btn--lg" id="checkoutBtn" type="button" data-i18n="checkout"></button>
      </div>
    </div>
  </aside>

  <!-- Оформление заказа -->
  <div class="modal" id="checkout" aria-hidden="true">
    <form class="modal__panel" id="orderForm" novalidate>
      <div class="drawer__head">
        <h2 data-i18n="checkout_title"></h2>
        <button class="icon-btn" data-close type="button" data-i18n-aria="close">✕</button>
      </div>
      <div class="form">
        <p class="hint-box" id="checkoutLogin"><span data-i18n="checkout_login"></span> <button class="link-btn link-btn--strong" type="button" data-open-auth data-i18n="sign_in"></button></p>
        <label><span data-i18n="name"></span><input name="name" required maxlength="100" autocomplete="name"></label>
        <div class="form__row">
          <label><span data-i18n="phone"></span><input name="phone" required type="tel" maxlength="30" autocomplete="tel" data-i18n-placeholder="phone_ph"></label>
          <label><span data-i18n="email"></span><input name="email" type="email" maxlength="100" autocomplete="email"></label>
        </div>

        <fieldset class="segmented">
          <legend data-i18n="delivery_method"></legend>
          <label><input type="radio" name="delivery_method" value="courier" checked><span data-i18n="by_courier"></span></label>
          <label><input type="radio" name="delivery_method" value="pickup"><span data-i18n="self_pickup"></span></label>
        </fieldset>
        <p class="muted small" id="pickupAddr" hidden></p>

        <label id="addressField"><span data-i18n="address"></span><textarea name="address" rows="2" maxlength="300" autocomplete="street-address" data-i18n-placeholder="address_ph"></textarea></label>

        <div class="form__row">
          <label><span data-i18n="date"></span><input name="delivery_date" type="date" required></label>
          <label id="timeField"><span data-i18n="time"></span><select name="delivery_time"></select></label>
        </div>

        <fieldset class="segmented">
          <legend data-i18n="payment_on_receipt"></legend>
          <label><input type="radio" name="payment_method" value="cash" checked><span data-i18n="cash"></span></label>
          <label><input type="radio" name="payment_method" value="card"><span data-i18n="card"></span></label>
        </fieldset>

        <label><span data-i18n="comment"></span><textarea name="comment" rows="2" maxlength="1000" data-i18n-placeholder="comment_ph"></textarea></label>

        <div class="summary">
          <div class="row"><span data-i18n="items"></span><span id="sumItems"></span></div>
          <div class="row"><span data-i18n="delivery"></span><span id="sumDelivery"></span></div>
          <div class="row row--total"><span data-i18n="total"></span><span id="sumTotal"></span></div>
        </div>
        <p class="muted small"><span data-i18n="order_privacy"></span> <a href="/privacy" target="_blank" data-i18n="privacy_acc"></a>.</p>
        <p class="error" id="orderError" hidden></p>
        <button class="btn btn--accent btn--block btn--lg" type="submit" id="submitOrder" data-i18n="confirm"></button>
      </div>
    </form>
  </div>

  <!-- Успех -->
  <div class="modal" id="success" aria-hidden="true">
    <div class="modal__panel modal__panel--small">
      <div class="success-icon">✓</div>
      <h2 data-i18n="thanks"></h2>
      <p id="successText"></p>
      <button class="btn btn--primary btn--block" data-close type="button" data-i18n="ok"></button>
    </div>
  </div>

  <!-- Вход и регистрация -->
  <div class="modal" id="authModal" aria-hidden="true">
    <form class="modal__panel modal__panel--auth" id="authForm" novalidate>
      <div class="drawer__head">
        <h2 id="authTitle"></h2>
        <button class="icon-btn" data-close type="button" data-i18n-aria="close">✕</button>
      </div>
      <div class="form">
        <p class="muted small" data-i18n="auth_why"></p>
        <label data-reg-only><span data-i18n="name"></span><input name="name" id="authName" maxlength="100" autocomplete="name"></label>
        <label><span>E-mail*</span><input name="email" id="authEmail" type="email" maxlength="100" autocomplete="email" required></label>
        <label><span data-i18n="password"></span><input name="password" id="authPassword" type="password" maxlength="200" required>
          <span class="muted small field-hint" data-reg-only data-i18n="password_hint"></span></label>
        <label data-reg-only><span data-i18n="phone"></span><input name="phone" id="authPhone" type="tel" maxlength="30" autocomplete="tel" data-i18n-placeholder="phone_ph"></label>
        <label class="consent" data-reg-only><input type="checkbox" name="consent" id="authConsent">
          <span><span data-i18n="consent_reg"></span> <a href="/privacy" target="_blank" data-i18n="privacy_acc"></a>.</span></label>
        <p class="error" id="authError" hidden></p>
        <button class="btn btn--accent btn--block btn--lg" type="submit" id="authSubmit"></button>
        <button class="link-btn auth-switch" type="button" id="authSwitch"></button>
      </div>
    </form>
  </div>

  <!-- Личный кабинет -->
  <div class="modal" id="accountModal" aria-hidden="true">
    <div class="modal__panel modal__panel--wide">
      <div class="drawer__head">
        <h2 id="accountHello"></h2>
        <button class="icon-btn" data-close type="button" data-i18n-aria="close">✕</button>
      </div>
      <div class="form">
        <nav class="tabs" id="accountTabs">
          <button class="tab active" type="button" data-acc-tab="orders" data-i18n="my_orders"></button>
          <button class="tab" type="button" data-acc-tab="profile" data-i18n="profile"></button>
        </nav>
        <section data-acc-panel="orders"><div class="orders" id="accountOrders"></div></section>
        <section data-acc-panel="profile" hidden>
          <form class="form form--flat" id="profileForm" novalidate>
            <label><span data-i18n="name"></span><input name="name" id="profName" maxlength="100" autocomplete="name"></label>
            <div class="form__row">
              <label><span data-i18n="phone"></span><input name="phone" id="profPhone" type="tel" maxlength="30" autocomplete="tel"></label>
              <label><span>E-mail</span><input id="profEmail" type="email" disabled></label>
            </div>
            <label><span data-i18n="address_default"></span><textarea name="address" id="profAddress" rows="2" maxlength="300" autocomplete="street-address" data-i18n-placeholder="address_ph"></textarea></label>
            <button class="btn btn--primary" type="submit" data-i18n="save"></button>
          </form>
          <form class="form form--flat" id="passwordForm" novalidate>
            <h3 data-i18n="change_password"></h3>
            <div class="form__row">
              <label><span data-i18n="current_password"></span><input name="current_password" id="curPassword" type="password" autocomplete="current-password"></label>
              <label><span data-i18n="new_password"></span><input name="new_password" id="newPassword" type="password" autocomplete="new-password" minlength="8"></label>
            </div>
            <button class="btn" type="submit" data-i18n="change_password"></button>
          </form>
          <button class="btn btn--danger" type="button" id="logoutBtn" data-i18n="logout"></button>
          <form class="form form--flat danger-zone" id="deleteForm" novalidate>
            <h3 data-i18n="delete_account"></h3>
            <p class="muted small" data-i18n="delete_account_text"></p>
            <div class="danger-zone__row">
              <input name="password" id="delPassword" type="password" autocomplete="current-password" data-i18n-placeholder="current_password">
              <button class="btn btn--danger" type="submit" data-i18n="delete_account"></button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/account.js"></script>
  <script src="/app.js"></script>
</body>
</html>
